services:
  db:
    image: public.ecr.aws/docker/library/postgres:17.7-alpine3.21
    environment:
      POSTGRES_USER: admin123
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: wex_db
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin123 -d wex_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    
